# The field API the handset talks to: one format, the contract's own, and the
# same for refusals — a refusal rendered in a format nobody registered is a 500.
api_platform:
    title: uhifadhi
    version: 1.0.0
    formats:
        json: ['application/json']
    error_formats:
        json: ['application/problem+json', 'application/json']
    defaults:
        stateless: true
        cache_headers:
            vary: ['Content-Type', 'Authorization', 'Origin']

# The only client is the handset, built against the written contract: no
# generated documentation, no entry point, no explorer on a production host.
when@prod:
    api_platform:
        enable_docs: false
        enable_swagger_ui: false
        enable_re_doc: false
        enable_entrypoint: false
